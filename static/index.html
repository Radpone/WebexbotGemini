<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c32">
  <title>Relay | 訊息接力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Relay 首頁">
      <span class="brand-mark"><i data-lucide="workflow"></i></span>
      <span>relay<span class="brand-dot">.</span></span>
    </a>
    <div class="topbar-meta">
      <span>WEBEX <b>×</b> GEMINI</span>
      <span class="topbar-divider"></span>
      <span class="environment"><i></i>PRODUCTION</span>
    </div>
  </header>

  <main>
    <section class="overview">
      <div>
        <p class="eyebrow">MESSAGE RELAY <span> / </span> 01</p>
        <h1>訊息接力</h1>
        <p class="overview-copy">WEBEX <span>→</span> GEMINI <span>→</span> WEBEX</p>
      </div>
      <div class="service-box">
        <span class="service-label">設定狀態</span>
        <span class="service-status checking" id="service-pill"><i></i><b id="service-state">確認中</b></span>
        <span class="updated-at" id="last-refresh">正在更新</span>
      </div>
    </section>

    <section class="flow" aria-label="訊息接力流程">
      <div class="flow-heading">
        <span>即時流程</span>
        <span class="flow-live"><i></i>自動接力</span>
      </div>
      <div class="flow-track">
        <article class="flow-stage stage-webex">
          <span class="stage-index">01 / 收件</span>
          <span class="stage-icon"><i data-lucide="message-square-text"></i></span>
          <h2>Webex</h2>
          <p>接收文字</p>
          <span class="stage-state" data-requires="webexBotToken,webhookSecret">確認中</span>
        </article>
        <span class="flow-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span>
        <article class="flow-stage stage-gemini">
          <span class="stage-index">02 / 生成</span>
          <span class="stage-icon"><i data-lucide="sparkles"></i></span>
          <h2>Gemini</h2>
          <p>生成文字回覆</p>
          <span class="stage-state" data-requires="googleApiKey">確認中</span>
        </article>
        <span class="flow-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span>
        <article class="flow-stage stage-reply">
          <span class="stage-index">03 / 回覆</span>
          <span class="stage-icon"><i data-lucide="send"></i></span>
          <h2>Webex</h2>
          <p>傳回原聊天室</p>
          <span class="stage-state" data-requires="webexBotToken">確認中</span>
        </article>
      </div>
      <div class="flow-foot">
        <span><i data-lucide="shield-check"></i>Webhook 簽章驗證</span>
        <span class="mono">MODEL <b id="chat-model">--</b></span>
      </div>
    </section>

    <section class="activity">
      <div class="activity-heading">
        <div>
          <p class="eyebrow">DELIVERY LOG</p>
          <h2>最近活動 <span id="event-count">0</span></h2>
        </div>
        <button class="icon-button" id="refresh-events" type="button" title="重新整理活動" aria-label="重新整理活動"><i data-lucide="refresh-cw"></i></button>
      </div>
      <div class="event-list" id="event-list" aria-live="polite">
        <div class="empty-state"><i data-lucide="inbox"></i><p>尚無訊息活動</p></div>
      </div>
      <footer class="activity-footer">
        <span><i></i>每 8 秒更新</span>
        <span>最近 40 筆事件</span>
      </footer>
    </section>

    <footer class="page-footer"><span>RELAY <i>·</i> WEBEX × GEMINI</span><span id="footer-time">--:-- UTC</span></footer>
  </main>
</body>
</html>
